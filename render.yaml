# KITOS 2.0 — Render Blueprint (Batch 3, Part E)
#
# Create the service with: Render dashboard → New → Blueprint → this repository.
# Render reads this file, creates `kitos-api`, and then asks for every value
# marked `sync: false`. Those are typed into the dashboard and never committed
# — see docs/DEPLOYMENT.md.
#
# Only the API is here. The client is a Next.js app on Vercel with its root
# directory set to `client`; Vercel has no blueprint format to put it in.

services:
  - type: web
    name: kitos-api
    runtime: node
    plan: free
    # Frankfurt is the closest Render region to Nigeria, and it is the one the
    # Atlas cluster should be created in too: a database on another continent
    # adds a round trip to every query, which the free tier can least afford.
    region: frankfurt
    rootDir: server
    buildCommand: npm ci
    startCommand: node src/index.js

    # Render polls this after every deploy and will not promote a build that
    # cannot answer it. It reports database reachability as well as liveness,
    # so a service that starts but cannot reach Atlas fails the deploy rather
    # than serving errors.
    healthCheckPath: /health

    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: NODE_ENV
        value: production

      # Render routes to this port. The app reads PORT and does not assume it.
      - key: PORT
        value: "10000"

      - key: LOG_LEVEL
        value: info

      # ── Secrets: Render prompts for each of these on first deploy ─────────
      #
      # `sync: false` means "ask, do not store in the repository". Every one
      # of these would be a credential leak if committed.

      # mongodb+srv://… from Atlas, including the password.
      - key: MONGODB_URI
        sync: false

      - key: MONGODB_DB_NAME
        value: kitos

      # Generated by Render, never seen by anyone, and different from any
      # local value — so a token minted in development cannot be replayed
      # against production. Rotating it signs every session out.
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 24h

      # The Vercel production URL, exactly — scheme, host, no trailing slash.
      # It is the only browser origin CORS allows, and the base for links in
      # outbound email. It is set after Vercel exists, which is why the
      # deployment guide has you redeploy once at that point.
      - key: CLIENT_ORIGIN
        sync: false

      # ── Storage ───────────────────────────────────────────────────────────
      # Must be `cloudinary` in production: Render's disk is wiped on every
      # deploy (ADR-008), so `local` would lose every submission, lesson
      # resource and chat attachment at the next push. The API refuses to
      # start if this is `cloudinary` and CLOUDINARY_URL is missing, which is
      # deliberate — a silent fallback to a disk that disappears is worse.
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false

      # ── Email ─────────────────────────────────────────────────────────────
      # Without SMTP_HOST the mailer writes .eml files to disk, which on
      # Render means a password-reset link nobody can read. Set all four.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Must be a sender the provider has verified, which may be a Brevo or
      # Gmail address rather than a KIT one (ADR-035). Replies still reach
      # the school because MAIL_REPLY_TO is set separately.
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        value: hello@kidsintech.school

      # ── Flutterwave (ADR-036) ─────────────────────────────────────────────
      # Test keys. Unset, the gateway simulates and no payment is real — which
      # is the correct state until the student adds the keys, not a failure.
      - key: FLW_SECRET_KEY
        sync: false
      # The dashboard's webhook "Secret hash", compared against the
      # `verif-hash` header. Unset, the webhook route rejects everything,
      # which is the right default.
      - key: FLW_WEBHOOK_HASH
        sync: false

      - key: LOGIN_RATE_LIMIT_MAX
        value: "10"

      # ── Demo seed guard ───────────────────────────────────────────────────
      # Left false on purpose. The one seeding run sets ALLOW_DEMO_SEED=true
      # and the three demo passwords **on the command line of that run**, from
      # a laptop, and nowhere else. Demo accounts can confirm payments and
      # read every child's record, so a password sitting in a dashboard is a
      # password anyone with dashboard access has.
      - key: ALLOW_DEMO_SEED
        value: "false"
