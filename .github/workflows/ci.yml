name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  server:
    name: Server — lint, test, audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint

      # The suite starts its own in-memory MongoDB replica set, so there is no
      # service container here. mongodb-memory-server downloads a binary on
      # first run; caching it keeps later runs quick.
      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Test
        working-directory: server
        run: npm test

      # NFR3: no high or critical advisories in anything that ships.
      - name: Audit production dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  client:
    name: Client — lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Build
        working-directory: client
        # Dummy public values: the build only needs them to exist. Nothing
        # secret belongs in a workflow file.
        env:
          NEXTAUTH_SECRET: ci-build-secret-not-used-at-runtime
          NEXTAUTH_URL: http://localhost:3004
          NEXT_PUBLIC_LMS_URL: http://localhost:3004
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_API_MOCKING: disabled
        run: npm run build

      # AC1.6: the mock worker must not reach a production build. Source maps
      # are excluded — they carry the comments that mention it, not the code.
      - name: Check MSW is absent from the build
        working-directory: client
        run: |
          found=$(grep -rl 'setupWorker\|msw/browser\|msw/node\|mockServiceWorker' .next/ 2>/dev/null | grep -v '\.map$' || true)
          if [ -n "$found" ]; then
            echo "MSW reached the production build:"
            echo "$found"
            exit 1
          fi
          echo "MSW is absent from the production build."

  e2e:
    name: End-to-end — smoke and axe
    runs-on: ubuntu-latest
    needs: [server, client]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install the server
        working-directory: server
        run: npm ci

      - name: Install the client
        working-directory: client
        run: npm ci

      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install Playwright's browser
        working-directory: client
        run: npx playwright install --with-deps chromium

      # The E2E run needs a real database, a real API and a real client: the
      # point of Batch 1 is that the retained frontend works against the
      # backend, which a mocked run would not show.
      - name: Start MongoDB
        working-directory: server
        run: npm run db:local &

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/27027) >/dev/null 2>&1; then
              echo "MongoDB is up."; exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not start in time."; exit 1

      - name: Seed
        working-directory: server
        env:
          NODE_ENV: development
          MONGODB_URI: mongodb://127.0.0.1:27027/?directConnection=true
          MONGODB_DB_NAME: kitos
          JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-bytes
          CLIENT_ORIGIN: http://localhost:3004
        run: npm run seed

      - name: Start the API
        working-directory: server
        env:
          NODE_ENV: development
          PORT: 4000
          MONGODB_URI: mongodb://127.0.0.1:27027/?directConnection=true
          MONGODB_DB_NAME: kitos
          JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-bytes
          CLIENT_ORIGIN: http://localhost:3004
          LOG_LEVEL: warn
          # The suite signs in as the same few demo accounts dozens of times,
          # which the real 10-per-15-minutes limit would stop halfway through.
          # This throwaway API only; the limiter itself is covered by the
          # server tests.
          LOGIN_RATE_LIMIT_MAX: 1000
        run: npm start &

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API is up."; exit 0
            fi
            sleep 2
          done
          echo "API did not start in time."; exit 1

      - name: Build and start the client
        working-directory: client
        env:
          NEXTAUTH_SECRET: ci-only-nextauth-secret-not-a-real-secret
          NEXTAUTH_URL: http://localhost:3004
          NEXT_PUBLIC_LMS_URL: http://localhost:3004
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_API_MOCKING: disabled
        run: |
          npm run build
          npm run start -- -p 3004 &

      - name: Wait for the client
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3004/login > /dev/null; then
              echo "Client is up."; exit 0
            fi
            sleep 2
          done
          echo "Client did not start in time."; exit 1

      - name: Run the end-to-end suite
        working-directory: client
        env:
          E2E_BASE_URL: http://localhost:3004
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
